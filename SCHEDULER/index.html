<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scheduler — Tracking</title>
<link rel="stylesheet" href="../ADMIN/style.css">
<link rel="stylesheet" href="style.css">
<script>
  /* Same session as the admin app - one login, and this page is admin-only.
     Checked before any markup renders so a signed-out visitor never sees a
     flash of the dashboard. */
  (function () {
    var token = localStorage.getItem('tms_token');
    var role  = localStorage.getItem('tms_role');
    if (!token || role !== 'admin') window.location.href = '../index.html';
  })();
</script>
</head>
<body>

<div class="sch-shell">
  <header class="sch-top">
    <div class="sch-brand">
      <span class="sch-mark">S</span>
      <div>
        <div class="sch-title">Scheduler</div>
        <div class="sch-sub">Rent generation &amp; penalty tracking</div>
      </div>
    </div>
    <div class="sch-top-actions">
      <span id="schAutoNote" class="sch-auto">auto-refreshing every 30s</span>
      <button class="btn btn-ghost" id="schRefreshBtn">Refresh</button>
      <a class="btn btn-ghost" href="../ADMIN/index.html">← Admin</a>
    </div>
  </header>

  <!--
    No "run now" button. The two schedulers are cron scripts that talk to the
    database; this screen reads back what they recorded. A button here would
    mean two things deciding when a bill is raised.
  -->

  <section id="schStatus" class="sch-status-row"></section>

  <div class="path-toggle sch-tabs" id="schTabs">
    <button class="path-btn active" data-tab="overview">Overview</button>
    <button class="path-btn" data-tab="runs">Runs</button>
    <button class="path-btn" data-tab="rent">Rent</button>
    <button class="path-btn" data-tab="penalty">Penalty</button>
    <button class="path-btn" data-tab="reports">Reports</button>
    <button class="path-btn" data-tab="settings">Settings</button>
  </div>

  <main id="schBody"><div class="sch-loading">Loading…</div></main>
</div>

<div id="toastStack" class="toast-stack"></div>
<div id="modalRoot"></div>

<script src="js/core.js"></script>
<script src="js/views.js"></script>
<script src="js/settings.js"></script>
<script src="js/init.js"></script>
</body>
</html>
