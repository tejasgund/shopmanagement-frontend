<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>My Portal — Shop &amp; Tenant Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
  <script>
    // Guard: only a signed-in tenant may view this page.
    (function () {
      try {
        var token = localStorage.getItem('tms_token');
        var role  = localStorage.getItem('tms_role');
        if (!token || !role) { window.location.replace('../index.html'); }
        else if (role === 'admin') { window.location.replace('../ADMIN/index.html'); }
      } catch (e) { window.location.replace('../index.html'); }
    })();
  </script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
</head>
<body>

<!-- ============================================================
     TENANT PORTAL SHELL
     ============================================================ -->
<div class="app show" id="tenantApp">
  <div class="tenant-shell">
    <div class="tenant-topbar">
      <div style="display:flex; align-items:center; gap:10px;">
      <div class="stamp-mark" style="background:var(--green);">Welcome</div>
        <div>
          <div style="font-weight:600; font-size:14.5px;" id="tenantName">—</div>
        <div style="font-size:11.5px; color:#9FAA9A;" id="tenantGreeting">Loading…</div>
        </div>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="btn-icon" id="tenantRefreshBtn" style="border-color:rgba(255,255,255,0.2); color:#fff;" title="Refresh" aria-label="Refresh data">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
        </button>
        <button class="logout-btn" id="tenantLogoutBtn" style="width:auto; margin-top:0;">Sign out</button>
      </div>
    </div>
    <div class="tenant-content" id="tenantContent">
      <!-- tenant views render here -->
    </div>
  </div>
</div>

<div class="toast-stack" id="toastStack"></div>

<!-- Modal shell (used by "send my meter reading") -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalEl">
    <div class="modal-head">
      <h3 id="modalTitle">—</h3>
      <button class="modal-close" id="modalCloseBtn" aria-label="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<script src="js/core.js"></script>
<script src="js/ui-helpers.js"></script>
<script src="js/tenant-dashboard.js"></script>
<script src="js/tenant-ledger.js"></script>
<script src="js/tenant-meters.js"></script>
<script src="js/init.js"></script>
</body>
</html>
