<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0">
<meta name="theme-color" content="#15201B">
<title>My Shop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
  <script>
    // Guard: only a signed-in tenant may view this page.
    (function () {
      try {
        var token = localStorage.getItem('tms_token');
        var role  = localStorage.getItem('tms_role');
        if (!token || !role) { window.location.replace('../index.html'); }
        else if (role === 'admin') { window.location.replace('../ADMIN/index.html'); }
      } catch (e) { window.location.replace('../index.html'); }
    })();
  </script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
</head>
<body>

<!-- ============================================================
     TENANT PORTAL
     Built phone-first: a short header, one screen at a time, and
     four big tabs along the bottom where a thumb can reach them.
     ============================================================ -->
<div class="tp-app" id="tenantApp">

  <header class="tp-header">
    <div class="tp-header-left">
      <div class="tp-avatar" id="tenantInitial">·</div>
      <div class="tp-header-text">
        <div class="tp-hello" id="tenantHello">Hello</div>
        <div class="tp-name" id="tenantName">…</div>
      </div>
    </div>
    <div class="tp-header-actions">
      <button class="tp-icon-btn" id="tenantRefreshBtn" title="Refresh" aria-label="Refresh">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
      </button>
      <button class="tp-icon-btn" id="tenantMoreBtn" title="More" aria-label="More">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>
      </button>
    </div>
  </header>

  <main class="tp-main" id="tenantContent"></main>

  <nav class="tp-tabs" id="tenantTabs" role="tablist">
    <button class="tp-tab active" data-tab="home" role="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10l9-7 9 7v10a1 1 0 01-1 1h-5v-7H9v7H4a1 1 0 01-1-1z"/></svg>
      <span>Home</span>
    </button>
    <button class="tp-tab" data-tab="bills" role="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3h14v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>
      <span>My bills</span>
      <span class="tp-tab-badge" id="billsBadge" style="display:none;">0</span>
    </button>
    <button class="tp-tab" data-tab="payments" role="tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="13" rx="2"/><path d="M2 11h20"/></svg>
      <span>I paid</span>
    </button>
    <button class="tp-tab" data-tab="meter" role="tab" id="meterTabBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 12l4-3"/></svg>
      <span>Meter</span>
      <span class="tp-tab-badge tp-tab-badge-green" id="meterBadge" style="display:none;">!</span>
    </button>
  </nav>
</div>

<div class="toast-stack" id="toastStack"></div>

<!-- Sheet-style modal (send a reading, more menu, bill detail) -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalEl">
    <div class="modal-head">
      <h3 id="modalTitle">—</h3>
      <button class="modal-close" id="modalCloseBtn" aria-label="Close">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<script src="js/core.js"></script>
<script src="js/ui-helpers.js"></script>
<script src="js/tenant-home.js"></script>
<script src="js/tenant-bills.js"></script>
<script src="js/tenant-payments.js"></script>
<script src="js/tenant-meters.js"></script>
<script src="js/tenant-more.js"></script>
<script src="js/tenant-app.js"></script>
</body>
</html>
