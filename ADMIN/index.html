<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Admin — Shop &amp; Tenant Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
  <script>
    // Guard: only a signed-in admin may view this page.
    (function () {
      try {
        var token = localStorage.getItem('tms_token');
        var role  = localStorage.getItem('tms_role');
        if (!token || !role) { window.location.replace('../index.html'); }
        else if (role !== 'admin') { window.location.replace('../USER/index.html'); }
      } catch (e) { window.location.replace('../index.html'); }
    })();
  </script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
</head>
<body>

<!-- ============================================================
     ADMIN APP SHELL
     ============================================================ -->
<div class="sidebar-scrim" id="sidebarScrim"></div>
<div class="app show" id="adminApp">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-mark">
      <div class="stamp-mark">S</div>
      <div class="wordmark">Sahyadri Buisness Park<span>.</span></div>
      <button type="button" class="sidebar-rail-toggle" id="sidebarRailToggle" aria-label="Collapse sidebar" aria-expanded="true">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
    </div>

    <nav>
      <div class="nav-group">
        <button class="nav-item active" data-view="dashboard" data-tooltip="Dashboard" title="Dashboard">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
          <span class="nav-item-label">Dashboard</span>
        </button>
      </div>
      <div class="nav-group" data-group="property">
        <button type="button" class="nav-label" data-group-toggle="property">
          <span>Property</span>
          <svg class="nav-label-arrow" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="nav-group-body">
          <button class="nav-item" data-view="complexes" data-tooltip="Complexes" title="Complexes">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 9h1m4 0h1m-5 4h1m4 0h1m-5 4h1m4 0h1"/></svg>
            <span class="nav-item-label">Complexes</span>
          </button>
          <button class="nav-item" data-view="shops" data-tooltip="Shops" title="Shops">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l1-5h16l1 5M4 9v10a1 1 0 001 1h14a1 1 0 001-1V9M4 9h16M9 21v-5a1 1 0 011-1h4a1 1 0 011 1v5"/></svg>
            <span class="nav-item-label">Shops</span>
          </button>
          <button class="nav-item" data-view="submeters" data-tooltip="Submeters" title="Submeters">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9h10M7 13h5"/><circle cx="17" cy="14" r="1.5"/></svg>
            <span class="nav-item-label">Submeters</span>
          </button>
        </div>
      </div>
      <div class="nav-group" data-group="people">
        <button type="button" class="nav-label" data-group-toggle="people">
          <span>People</span>
          <svg class="nav-label-arrow" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="nav-group-body">
          <button class="nav-item" data-view="users" data-tooltip="Users" title="Users">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="7" r="4"/><path d="M2 21v-2a4 4 0 014-4h6a4 4 0 014 4v2M17 7a4 4 0 010 8M23 21v-2a4 4 0 00-3-3.87"/></svg>
            <span class="nav-item-label">Users</span>
          </button>
        </div>
      </div>
      <div class="nav-group" data-group="finance">
        <button type="button" class="nav-label" data-group-toggle="finance">
          <span>Finance</span>
          <svg class="nav-label-arrow" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="nav-group-body">
          <button class="nav-item" data-view="billing" data-tooltip="Finance" title="Finance">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 2h13l3 3v17H4z"/><path d="M9 7h6M9 11h6M9 15h4"/></svg>
            <span class="nav-item-label">Finance</span>
            <span class="nav-badge" id="pendingBadge" style="display:none;">0</span>
          </button>
          <button class="nav-item" data-view="deposits" data-tooltip="Deposits" title="Deposits">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/></svg>
            <span class="nav-item-label">Deposits</span>
          </button>
          <button class="nav-item" data-view="meters" data-tooltip="Meter Readings" title="Meter Readings">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 12l4-3"/><path d="M12 7v1M17 12h-1M12 17v-1M7 12h1"/></svg>
            <span class="nav-item-label">Meter Readings</span>
            <span class="nav-badge" id="meterBadge" style="display:none;">0</span>
          </button>
        </div>
      </div>
      <div class="nav-group" data-group="insights">
        <button type="button" class="nav-label" data-group-toggle="insights">
          <span>Insights</span>
          <svg class="nav-label-arrow" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="nav-group-body">
          <button class="nav-item" data-view="reports" data-tooltip="Reports" title="Reports">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M18 9l-5 5-3-3-4 4"/></svg>
            <span class="nav-item-label">Reports</span>
          </button>
          <button class="nav-item" data-view="audit" data-tooltip="Audit Log" title="Audit Log">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="13" y2="17"/></svg>
            <span class="nav-item-label">Audit Log</span>
          </button>
          <button class="nav-item" data-view="settings" data-tooltip="Settings" title="Settings">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
            <span class="nav-item-label">Settings</span>
          </button>
        </div>
      </div>
    </nav>
    <button type="button" class="nav-collapse-all" id="navCollapseAllBtn">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
      <span id="navCollapseAllText">Collapse all</span>
    </button>

    <div class="sidebar-foot">
      <div class="user-chip">
        <div class="user-avatar" id="sidebarAvatar">A</div>
        <div class="user-meta">
          <div class="name" id="sidebarUserName">Admin</div>
          <div class="role" id="sidebarUserRole">admin</div>
        </div>
      </div>
      <button class="logout-btn" id="logoutBtn" data-tooltip="Sign out" title="Sign out">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        <span class="logout-btn-label">Sign out</span>
      </button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div style="display:flex; align-items:center; gap:10px;">
        <button class="menu-toggle" id="menuToggle" aria-label="Open menu">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div>
          <h2 id="viewTitle">Dashboard</h2>
          <div class="crumb" id="viewCrumb">Overview of your portfolio</div>
        </div>
      </div>
      <div class="topbar-actions">
        <div style="position:relative;">
          <input class="search-input" id="globalSearch" placeholder="Search users, shops…" style="min-width:200px; max-width:240px; padding-right:36px;" autocomplete="off">
          <div id="globalSearchResults" style="display:none; position:absolute; top:calc(100% + 6px); right:0; width:320px; background:var(--paper-raised); border:1.5px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow-lg); z-index:100; max-height:340px; overflow-y:auto;"></div>
        </div>
        <button class="btn-icon" id="refreshBtn" title="Refresh data" aria-label="Refresh data">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
        </button>
        <button class="btn btn-primary btn-sm" id="primaryActionBtn">+ Add</button>
      </div>
    </div>
    <div class="content" id="viewContent">
      <!-- views render here -->
    </div>
  </main>
</div>

<div class="toast-stack" id="toastStack"></div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalEl" role="dialog" aria-modal="true">
    <div class="modal-head">
      <h3 id="modalTitle">Title</h3>
      <button class="modal-close" id="modalCloseBtn" aria-label="Close">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<script src="js/core.js"></script>
<script src="js/nav.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/complexes.js"></script>
<script src="js/shops.js"></script>
<script src="js/users.js"></script>
<script src="js/billing.js"></script>
<script src="js/finance.js"></script>
<script src="js/audit.js"></script>
<script src="js/deposits.js"></script>
<script src="js/meters.js"></script>
<script src="js/submeters.js"></script>
<script src="js/settings.js"></script>
<script src="js/reports.js"></script>
<script src="js/modals.js"></script>
<script src="js/bill-modal.js"></script>
<script src="js/payment-modal.js"></script>
<script src="js/init.js"></script>
</body>
</html>
